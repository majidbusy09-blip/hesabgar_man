name: JET AI - Hesabgar Read-Only Task Intake

on:
  issues:
    # A task is admitted when the agent-task label is added; "opened" would
    # duplicate the labeled event when an issue is created with that label.
    types: [labeled, edited]

permissions:
  contents: read
  issues: read

jobs:
  validate-and-package:
    uses: majidbusy09-blip/jetconfig-vpn/.github/workflows/agent-task-intake-reusable.yml@053c1f6e3a695cc8675bc90a679c554ed0e83f18
    permissions:
      contents: read
      issues: read
    secrets: inherit
