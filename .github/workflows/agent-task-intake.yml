name: JET AI - Hesabgar Read-Only Task Intake

on:
  issues:
    # A task is admitted when the agent-task label is added; "opened" would
    # duplicate the labeled event when an issue is created with that label.
    types: [labeled, edited]

permissions:
  contents: read
  issues: read

jobs:
  validate-and-package:
    uses: majidbusy09-blip/jetconfig-vpn/.github/workflows/agent-task-intake-reusable.yml@3e5409e5dd6991ec3f6921ae1996d53dd6849f8d
    permissions:
      contents: read
      issues: read
    secrets: inherit
