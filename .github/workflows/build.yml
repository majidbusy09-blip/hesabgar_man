name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backup source files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/
          if [ -d assets ]; then cp -r assets /tmp/backup/; fi
          if [ -f pubspec.lock ]; then cp pubspec.lock /tmp/backup/; fi

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name hesabgar_man --org ir.hesabgar

      - name: Restore source files
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib .
          cp /tmp/backup/pubspec.yaml .
          if [ -d /tmp/backup/assets ]; then rm -rf assets; cp -r /tmp/backup/assets .; fi
          if [ -f /tmp/backup/pubspec.lock ]; then cp /tmp/backup/pubspec.lock .; fi

      - name: Setup release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "NO_RELEASE_KEY=1" >> $GITHUB_ENV
            echo "No KEYSTORE_BASE64 secret — using default debug signing"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/hesabgar-release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=hesabgar-release.jks"
          } > android/key.properties
          echo "NO_RELEASE_KEY=0" >> $GITHUB_ENV
          ls -la android/app/hesabgar-release.jks android/key.properties

      - name: Configure Gradle signing
        if: env.NO_RELEASE_KEY == '0'
        run: |
          GRADLE=""
          if [ -f android/app/build.gradle ]; then GRADLE=android/app/build.gradle; fi
          if [ -f android/app/build.gradle.kts ]; then GRADLE=android/app/build.gradle.kts; fi
          if [ -z "$GRADLE" ]; then echo "No gradle file"; exit 1; fi
          echo "Patching $GRADLE"
          if echo "$GRADLE" | grep -q '\.kts$'; then
            if ! grep -q keystoreProperties "$GRADLE"; then
              printf '%s\n' \
                'val keystoreProperties = java.util.Properties()' \
                'val keystorePropertiesFile = rootProject.file("key.properties")' \
                'if (keystorePropertiesFile.exists()) {' \
                '    keystoreProperties.load(keystorePropertiesFile.inputStream())' \
                '}' \
                '' > /tmp/ks_header.txt
              cat /tmp/ks_header.txt "$GRADLE" > /tmp/gradle_out && mv /tmp/gradle_out "$GRADLE"
            fi
            if ! grep -q 'signingConfigs' "$GRADLE"; then
              sed -i 's/android {/android {\n    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String?\n            keyPassword = keystoreProperties["keyPassword"] as String?\n            storeFile = keystoreProperties["storeFile"]?.let { file(it as String) }\n            storePassword = keystoreProperties["storePassword"] as String?\n        }\n    }/' "$GRADLE"
            fi
            if ! grep -q 'signingConfig = signingConfigs.getByName("release")' "$GRADLE"; then
              sed -i 's/release {/release {\n            signingConfig = signingConfigs.getByName("release")/' "$GRADLE"
            fi
          else
            if ! grep -q keystoreProperties "$GRADLE"; then
              printf '%s\n' \
                'def keystoreProperties = new Properties()' \
                "def keystorePropertiesFile = rootProject.file('key.properties')" \
                'if (keystorePropertiesFile.exists()) {' \
                '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))' \
                '}' \
                '' > /tmp/ks_header.txt
              cat /tmp/ks_header.txt "$GRADLE" > /tmp/gradle_out && mv /tmp/gradle_out "$GRADLE"
            fi
            if ! grep -q 'signingConfigs' "$GRADLE"; then
              sed -i "s/android {/android {\n    signingConfigs {\n        release {\n            keyAlias keystoreProperties['keyAlias']\n            keyPassword keystoreProperties['keyPassword']\n            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n            storePassword keystoreProperties['storePassword']\n        }\n    }/" "$GRADLE"
            fi
            if ! grep -q 'signingConfig signingConfigs.release' "$GRADLE"; then
              sed -i 's/release {/release {\n            signingConfig signingConfigs.release/' "$GRADLE"
            fi
          fi
          echo "Gradle signing configured"

      - name: Add Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for PERM in android.permission.INTERNET android.permission.VIBRATE android.permission.READ_MEDIA_IMAGES; do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "s|<application|  <uses-permission android:name=\"$PERM\"/>\n    <application|" "$MANIFEST"
            fi
          done
          if ! grep -q READ_EXTERNAL_STORAGE "$MANIFEST"; then
            sed -i 's|<application|  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application|' "$MANIFEST"
          fi
          echo "Permissions added"
          head -30 "$MANIFEST"

      - name: Download Vazirmatn Font
        run: |
          mkdir -p assets/fonts
          curl -L -o vazir.zip https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip
          unzip -j vazir.zip "fonts/ttf/Vazirmatn-Regular.ttf" -d assets/fonts/
          unzip -j vazir.zip "fonts/ttf/Vazirmatn-Medium.ttf" -d assets/fonts/
          unzip -j vazir.zip "fonts/ttf/Vazirmatn-Bold.ttf" -d assets/fonts/

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabgar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
