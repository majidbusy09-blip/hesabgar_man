name: Build APK and Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backup source files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/
          if [ -d assets ]; then cp -r assets /tmp/backup/; fi
          if [ -d tool ]; then cp -r tool /tmp/backup/; fi
          if [ -f pubspec.lock ]; then cp pubspec.lock /tmp/backup/; fi

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name hesabgar_man --org ir.hesabgar

      - name: Restore source files
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib .
          cp /tmp/backup/pubspec.yaml .
          if [ -d /tmp/backup/assets ]; then rm -rf assets; cp -r /tmp/backup/assets .; fi
          if [ -d /tmp/backup/tool ]; then rm -rf tool; cp -r /tmp/backup/tool .; fi
          if [ -f /tmp/backup/pubspec.lock ]; then cp /tmp/backup/pubspec.lock .; fi

      - name: Setup release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "NO_RELEASE_KEY=1" >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_BASE64 is not configured; APK will use debug signing and is not suitable for store publication."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/hesabgar-release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=hesabgar-release.jks"
          } > android/key.properties
          echo "NO_RELEASE_KEY=0" >> "$GITHUB_ENV"

      - name: Configure Gradle signing
        if: env.NO_RELEASE_KEY == '0'
        run: |
          python3 tool/patch_signing.py
          echo "Gradle signing configuration updated."

      - name: Add Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for PERM in android.permission.INTERNET android.permission.VIBRATE android.permission.READ_MEDIA_IMAGES; do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "s|<application|  <uses-permission android:name=\"$PERM\"/>\n    <application|" "$MANIFEST"
            fi
          done
          if ! grep -q "android.permission.READ_EXTERNAL_STORAGE" "$MANIFEST"; then
            sed -i 's|<application|  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application|' "$MANIFEST"
          fi

      - name: Download Vazirmatn Font
        run: |
          mkdir -p assets/fonts
          curl --fail --location --retry 3 -o vazir.zip https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip
          unzip -o -j vazir.zip 'fonts/ttf/Vazirmatn-Regular.ttf' -d assets/fonts/
          unzip -o -j vazir.zip 'fonts/ttf/Vazirmatn-Medium.ttf' -d assets/fonts/
          unzip -o -j vazir.zip 'fonts/ttf/Vazirmatn-Bold.ttf' -d assets/fonts/

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabgar-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
