name: Build APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# لازم برای ساخت Release خودکار
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backup source files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/
          if [ -d assets ]; then cp -r assets /tmp/backup/; fi
          if [ -d tool ]; then cp -r tool /tmp/backup/; fi
          if [ -f pubspec.lock ]; then cp pubspec.lock /tmp/backup/; fi

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name hesabgar_man --org ir.hesabgar

      - name: Restore source files
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib .
          cp /tmp/backup/pubspec.yaml .
          if [ -d /tmp/backup/assets ]; then rm -rf assets; cp -r /tmp/backup/assets .; fi
          if [ -d /tmp/backup/tool ]; then rm -rf tool; cp -r /tmp/backup/tool .; fi
          if [ -f /tmp/backup/pubspec.lock ]; then cp /tmp/backup/pubspec.lock .; fi

      # NDK 28.x گاهی با خطای ZipFile خراب دانلود می‌شود؛ نسخه پایدارتر را پین می‌کنیم
      - name: Setup Android NDK (pinned)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Pin ndkVersion in Gradle
        run: |
          NDK_VER="27.2.12479018"
          if [ -f android/app/build.gradle.kts ]; then
            if grep -q 'ndkVersion' android/app/build.gradle.kts; then
              sed -i -E 's/ndkVersion\s*=\s*"[^"]+"/ndkVersion = "'"$NDK_VER"'"/' android/app/build.gradle.kts
            else
              sed -i '/^android {/a\    ndkVersion = "'"$NDK_VER"'"' android/app/build.gradle.kts
            fi
            echo "Pinned ndkVersion in build.gradle.kts"
            grep -n ndkVersion android/app/build.gradle.kts || true
          elif [ -f android/app/build.gradle ]; then
            if grep -q 'ndkVersion' android/app/build.gradle; then
              sed -i -E 's/ndkVersion\s+"[^"]+"/ndkVersion "'"$NDK_VER"'"/' android/app/build.gradle
            else
              sed -i '/^android {/a\    ndkVersion "'"$NDK_VER"'"' android/app/build.gradle
            fi
            echo "Pinned ndkVersion in build.gradle"
            grep -n ndkVersion android/app/build.gradle || true
          else
            echo "No app build.gradle found yet"
            ls -la android/app || true
          fi

      - name: Read app version
        id: ver
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version: //' | tr -d '[:space:]')
          NAME="${VERSION%%+*}"
          CODE="${VERSION##*+}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Setup release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "NO_RELEASE_KEY=1" >> $GITHUB_ENV
            echo "No KEYSTORE_BASE64 secret — using default debug signing"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/hesabgar-release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=hesabgar-release.jks"
          } > android/key.properties
          echo "NO_RELEASE_KEY=0" >> $GITHUB_ENV
          ls -la android/app/hesabgar-release.jks android/key.properties

      - name: Configure Gradle signing
        if: env.NO_RELEASE_KEY == '0'
        run: |
          python3 tool/patch_signing.py
          echo "---- android/app/build.gradle.kts (head) ----"
          head -80 android/app/build.gradle.kts || head -80 android/app/build.gradle || true

      - name: Set Persian app name
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # نام نمایشی زیر آیکون
          sed -i 's/android:label="[^"]*"/android:label="حسابگر من"/' "$MANIFEST"
          # اگر label نبود داخل application اضافه کن
          if ! grep -q 'android:label=' "$MANIFEST"; then
            sed -i 's/<application/<application android:label="حسابگر من"/' "$MANIFEST"
          fi
          grep -o 'android:label="[^"]*"' "$MANIFEST" || true

      - name: Add Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for PERM in android.permission.INTERNET android.permission.VIBRATE android.permission.READ_MEDIA_IMAGES; do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "s|<application|  <uses-permission android:name=\"$PERM\"/>\n    <application|" "$MANIFEST"
            fi
          done
          if ! grep -q READ_EXTERNAL_STORAGE "$MANIFEST"; then
            sed -i 's|<application|  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application|' "$MANIFEST"
          fi
          echo "Permissions added"

      - name: Download Vazirmatn Font
        run: |
          mkdir -p assets/fonts
          curl -L -o vazir.zip https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip
          unzip -j vazir.zip "fonts/ttf/Vazirmatn-Regular.ttf" -d assets/fonts/
          unzip -j vazir.zip "fonts/ttf/Vazirmatn-Medium.ttf" -d assets/fonts/
          unzip -j vazir.zip "fonts/ttf/Vazirmatn-Bold.ttf" -d assets/fonts/

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: |
          # تست پیش‌فرض flutter create (counter) با اپ واقعی سازگار نیست
          rm -f test/widget_test.dart
          flutter test test/calculator_logic_test.dart test/finance_logic_test.dart test/expense_model_test.dart test/accounting_logic_test.dart test/report_logic_test.dart

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Build APK
        run: |
          # یک بار تلاش مجدد در صورت خطای موقتی Gradle/NDK
          flutter build apk --release || flutter build apk --release

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Collect release files
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/hesabgar-man-${{ steps.ver.outputs.name }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/hesabgar-man-${{ steps.ver.outputs.name }}.aab"
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabgar-apk
          path: dist/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabgar-aab
          path: dist/*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-b${{ github.run_number }}
          name: "حسابگر من ${{ steps.ver.outputs.name }} (build ${{ github.run_number }})"
          body: |
            ## حسابگر من ${{ steps.ver.outputs.name }}
            - Build: `${{ github.run_number }}`
            - Commit: `${{ github.sha }}`
            - نسخه pubspec: `${{ steps.ver.outputs.version }}`

            ### فایل‌ها
            - **APK** — نصب مستقیم روی گوشی / بازار / مایکت
            - **AAB** — انتشار در Google Play
          files: |
            dist/*.apk
            dist/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
