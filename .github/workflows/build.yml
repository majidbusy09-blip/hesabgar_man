name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backup source files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/
          if [ -d assets ]; then cp -r assets /tmp/backup/; fi
          if [ -f pubspec.lock ]; then cp pubspec.lock /tmp/backup/; fi
          ls -la /tmp/backup/

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name hesabgar_man --org com.example

      - name: Restore source files
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib .
          cp /tmp/backup/pubspec.yaml .
          if [ -d /tmp/backup/assets ]; then rm -rf assets; cp -r /tmp/backup/assets .; fi
          if [ -f /tmp/backup/pubspec.lock ]; then cp /tmp/backup/pubspec.lock .; fi
          echo "=== pubspec ==="
          grep -A40 "^dependencies:" pubspec.yaml
          ls -la assets/brand/ || true

      - name: Add gallery permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_IMAGES" "$MANIFEST"; then
            sed -i 's|<application|  <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application|' "$MANIFEST"
            echo "permissions added"
          else
            echo "permissions already present"
          fi

      - name: Download Vazirmatn Font
        run: |
          mkdir -p assets/fonts
          curl -L -o vazir.zip https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip
          unzip -j vazir.zip "fonts/ttf/Vazirmatn-Regular.ttf" -d assets/fonts/
          unzip -j vazir.zip "fonts/ttf/Vazirmatn-Medium.ttf" -d assets/fonts/
          unzip -j vazir.zip "fonts/ttf/Vazirmatn-Bold.ttf" -d assets/fonts/

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabgar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
