name: Build APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# هر push جدید روی main، بیلد قبلی همان شاخه را لغو می‌کند تا صف گیر نکند
concurrency:
  group: build-main
  cancel-in-progress: true

# لازم برای ساخت Release خودکار
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backup source files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/
          if [ -d assets ]; then cp -r assets /tmp/backup/; fi
          if [ -d tool ]; then cp -r tool /tmp/backup/; fi
          if [ -f pubspec.lock ]; then cp pubspec.lock /tmp/backup/; fi

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name hesabgar_man --org ir.hesabgar

      - name: Restore source files
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib .
          cp /tmp/backup/pubspec.yaml .
          if [ -d /tmp/backup/assets ]; then rm -rf assets; cp -r /tmp/backup/assets .; fi
          if [ -d /tmp/backup/tool ]; then rm -rf tool; cp -r /tmp/backup/tool .; fi
          if [ -f /tmp/backup/pubspec.lock ]; then cp /tmp/backup/pubspec.lock .; fi

      # NDK 28.x گاهی با خطای ZipFile خراب دانلود می‌شود؛ نسخه پایدارتر را پین می‌کنیم

      - name: Patch Android notifications
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Permissions
            if ! grep -q 'POST_NOTIFICATIONS' "$MANIFEST"; then
              sed -i 's|<manifest |<manifest |' "$MANIFEST"
              # insert before <application
              sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>' "$MANIFEST"
            fi
            # Receivers for scheduled notifications (flutter_local_notifications)
            if ! grep -q 'ScheduledNotificationReceiver' "$MANIFEST"; then
              sed -i '/<\/application>/i\        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n            </intent-filter>\n        </receiver>' "$MANIFEST"
            fi
            echo "=== AndroidManifest (notifications) ==="
            head -40 "$MANIFEST" || true
          else
            echo "Manifest not found"
            exit 1
          fi


      - name: Enable core library desugaring (notifications)
        run: |
          # لازم برای flutter_local_notifications
          DESUGAR='com.android.tools:desugar_jdk_libs:2.1.4'
          if [ -f android/app/build.gradle.kts ]; then
            FILE=android/app/build.gradle.kts
            if ! grep -q 'coreLibraryDesugaringEnabled' "$FILE"; then
              # compileOptions block
              if grep -q 'compileOptions' "$FILE"; then
                sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' "$FILE"
              else
                sed -i '/android {/a\    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }' "$FILE"
              fi
            fi
            if ! grep -q 'desugar_jdk_libs' "$FILE"; then
              if grep -q '^dependencies {' "$FILE"; then
                sed -i '/^dependencies {/a\    coreLibraryDesugaring("'"$DESUGAR"'")' "$FILE"
              else
                printf '\ndependencies {\n    coreLibraryDesugaring("%s")\n}\n' "$DESUGAR" >> "$FILE"
              fi
            fi
            echo "=== app/build.gradle.kts (desugar) ==="
            grep -n -E 'desugar|coreLibrary|compileOptions' "$FILE" || true
          elif [ -f android/app/build.gradle ]; then
            FILE=android/app/build.gradle
            if ! grep -q 'coreLibraryDesugaringEnabled' "$FILE"; then
              if grep -q 'compileOptions' "$FILE"; then
                sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' "$FILE"
              else
                sed -i '/android {/a\    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }' "$FILE"
              fi
            fi
            if ! grep -q 'desugar_jdk_libs' "$FILE"; then
              if grep -q 'dependencies {' "$FILE"; then
                sed -i '/dependencies {/a\    coreLibraryDesugaring "'"$DESUGAR"'"' "$FILE"
              else
                printf '\ndependencies {\n    coreLibraryDesugaring "%s"\n}\n' "$DESUGAR" >> "$FILE"
              fi
            fi
            echo "=== app/build.gradle (desugar) ==="
            grep -n -E 'desugar|coreLibrary|compileOptions' "$FILE" || true
          else
            echo "No app build.gradle found"
            ls -la android/app || true
            exit 1
          fi

      - name: Setup Android NDK (pinned)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Pin ndkVersion in Gradle
        run: |
          NDK_VER="27.2.12479018"
          if [ -f android/app/build.gradle.kts ]; then
            if grep -q 'ndkVersion' android/app/build.gradle.kts; then
              sed -i -E 's/ndkVersion\s*=\s*"[^"]+"/ndkVersion = "'"$NDK_VER"'"/' android/app/build.gradle.kts
            else
              sed -i '/^android {/a\    ndkVersion = "'"$NDK_VER"'"' android/app/build.gradle.kts
            fi
            echo "Pinned ndkVersion in build.gradle.kts"
            grep -n ndkVersion android/app/build.gradle.kts || true
          elif [ -f android/app/build.gradle ]; then
            if grep -q 'ndkVersion' android/app/build.gradle; then
              sed -i -E 's/ndkVersion\s+"[^"]+"/ndkVersion "'"$NDK_VER"'"/' android/app/build.gradle
            else
              sed -i '/^android {/a\    ndkVersion "'"$NDK_VER"'"' android/app/build.gradle
            fi
            echo "Pinned ndkVersion in build.gradle"
            grep -n ndkVersion android/app/build.gradle || true
          else
            echo "No app build.gradle found yet"
            ls -la android/app || true
          fi

      - name: Read app version
        id: ver
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version: //' | tr -d '[:space:]')
          NAME="${VERSION%%+*}"
          CODE="${VERSION##*+}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Setup release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "NO_RELEASE_KEY=1" >> $GITHUB_ENV
            echo "No KEYSTORE_BASE64 secret — using default debug signing"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/hesabgar-release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=hesabgar-release.jks"
          } > android/key.properties
          echo "NO_RELEASE_KEY=0" >> $GITHUB_ENV
          ls -la android/app/hesabgar-release.jks android/key.properties

      - name: Configure Gradle signing
        if: env.NO_RELEASE_KEY == '0'
        run: |
          python3 tool/patch_signing.py
          echo "---- android/app/build.gradle.kts (head) ----"
          head -80 android/app/build.gradle.kts || head -80 android/app/build.gradle || true

      - name: Set Persian app name
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # نام نمایشی زیر آیکون
          sed -i 's/android:label="[^"]*"/android:label="حسابگر من"/' "$MANIFEST"
          # اگر label نبود داخل application اضافه کن
          if ! grep -q 'android:label=' "$MANIFEST"; then
            sed -i 's/<application/<application android:label="حسابگر من"/' "$MANIFEST"
          fi
          grep -o 'android:label="[^"]*"' "$MANIFEST" || true

      - name: Add Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for PERM in android.permission.INTERNET android.permission.VIBRATE android.permission.READ_MEDIA_IMAGES; do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "s|<application|  <uses-permission android:name=\"$PERM\"/>\n    <application|" "$MANIFEST"
            fi
          done
          if ! grep -q READ_EXTERNAL_STORAGE "$MANIFEST"; then
            sed -i 's|<application|  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application|' "$MANIFEST"
          fi
          echo "Permissions added"

      - name: Download Vazirmatn Font
        run: |
          mkdir -p assets/fonts
          curl -L -o vazir.zip https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip
          unzip -j vazir.zip "fonts/ttf/Vazirmatn-Regular.ttf" -d assets/fonts/
          unzip -j vazir.zip "fonts/ttf/Vazirmatn-Medium.ttf" -d assets/fonts/
          unzip -j vazir.zip "fonts/ttf/Vazirmatn-Bold.ttf" -d assets/fonts/

      - name: Install dependencies
        run: flutter pub get

      - name: Remove default Flutter counter test
        run: rm -f test/widget_test.dart

      - name: Analyze
        run: |
          rm -f test/widget_test.dart
          # فقط کد فعال اپ (ورود main + فایل‌های یکپارچه). پوشه‌های قدیمی
          # lib/features/* و lib/shared/* و lib/core/* موازی در analyze نیستند.
          set +e
          flutter analyze \
            lib/main.dart \
            lib/core.dart \
            lib/features.dart \
            lib/calendar_v2.dart \
            lib/checks.dart \
            lib/notifications.dart \
            test \
            > analyze_out.txt 2>&1
          CODE=$?
          set -e
          # حذف کد رنگی ترمینال برای grep پایدار
          sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' analyze_out.txt > analyze_clean.txt || cp analyze_out.txt analyze_clean.txt
          cat analyze_out.txt
          echo "---- ERROR lines (if any) ----"
          grep -E 'error •|error -' analyze_clean.txt || true
          if grep -qE 'error •|error -' analyze_clean.txt; then
            # نادیده گرفتن خطوط خلاصه مثل "error • ..." در صورت نیاز؛ فقط severity اول خط
            if grep -qE '^[[:space:]]*error [•-]' analyze_clean.txt; then
              echo "Analyze found ERROR level issues"
              exit 1
            fi
          fi
          echo "Analyze OK (no error-level issues; exit was $CODE)"
          exit 0


      - name: Run unit tests
        run: |
          # تست پیش‌فرض flutter create (counter) با اپ واقعی سازگار نیست
          rm -f test/widget_test.dart
          flutter test --reporter expanded test/calculator_logic_test.dart test/finance_logic_test.dart test/expense_model_test.dart test/accounting_logic_test.dart test/report_logic_test.dart test/category_store_test.dart test/calendar_recurrence_test.dart test/calendar_storage_test.dart test/checks_model_test.dart test/checks_finance_test.dart


      - name: Fix R8/Gson for scheduled notifications
        run: |
          # خطای معروف: Missing type parameter در zonedSchedule (Gson + R8)
          mkdir -p android/app
          cat > android/app/proguard-rules.pro << 'PROGUARD'
          ## Gson — لازم برای flutter_local_notifications
          -keepattributes Signature
          -keepattributes *Annotation*
          -dontwarn sun.misc.**
          -keep class com.google.gson.stream.** { *; }
          -keep class * extends com.google.gson.TypeAdapter
          -keep class * implements com.google.gson.TypeAdapterFactory
          -keep class * implements com.google.gson.JsonSerializer
          -keep class * implements com.google.gson.JsonDeserializer
          -keepclassmembers,allowobfuscation class * {
            @com.google.gson.annotations.SerializedName <fields>;
          }
          -keep,allowobfuscation,allowshrinking class com.google.gson.reflect.TypeToken
          -keep,allowobfuscation,allowshrinking class * extends com.google.gson.reflect.TypeToken

          ## پلاگین اعلان
          -keep class com.dexterous.flutterlocalnotifications.** { *; }
          PROGUARD
          # حذف تورفتگی اضافه از heredoc بالا
          sed -i 's/^          //' android/app/proguard-rules.pro

          # R8 full mode گاهی TypeToken را خراب می‌کند
          touch android/gradle.properties
          grep -q 'android.enableR8.fullMode' android/gradle.properties \
            || echo 'android.enableR8.fullMode=false' >> android/gradle.properties

          # اتصال proguard به release در build.gradle.kts یا .gradle
          if [ -f android/app/build.gradle.kts ]; then
            FILE=android/app/build.gradle.kts
            if ! grep -q 'proguard-rules.pro' "$FILE"; then
              if grep -q 'release {' "$FILE"; then
                sed -i '/release {/a\            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")' "$FILE"
              fi
            fi
            echo "=== release block (kts) ==="
            grep -n -A8 'release {' "$FILE" | head -20
          elif [ -f android/app/build.gradle ]; then
            FILE=android/app/build.gradle
            if ! grep -q 'proguard-rules.pro' "$FILE"; then
              if grep -q 'release {' "$FILE"; then
                sed -i '/release {/a\            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"' "$FILE"
              fi
            fi
            echo "=== release block (gradle) ==="
            grep -n -A8 'release {' "$FILE" | head -20
          fi
          echo "=== proguard-rules.pro ==="
          cat android/app/proguard-rules.pro
          echo "=== gradle.properties R8 ==="
          grep R8 android/gradle.properties || true

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true


      - name: Disable lintVital (image_picker AGP bug)
        run: |
          mkdir -p android
          touch android/gradle.properties
          grep -q 'android.lint.checkReleaseBuilds' android/gradle.properties || echo 'android.lint.checkReleaseBuilds=false' >> android/gradle.properties
          # پچ lint در app build.gradle / kts بدون heredoc تو در تو
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            if grep -q 'checkReleaseBuilds' "$f"; then
              echo "already patched $f"
              continue
            fi
            if echo "$f" | grep -q '\.kts$'; then
              awk '
                /^android \{/ && !done {
                  print
                  print "    lint {"
                  print "        checkReleaseBuilds = false"
                  print "        abortOnError = false"
                  print "    }"
                  done=1
                  next
                }
                { print }
              ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            else
              awk '
                /^android \{/ && !done {
                  print
                  print "    lint {"
                  print "        checkReleaseBuilds false"
                  print "        abortOnError false"
                  print "    }"
                  done=1
                  next
                }
                { print }
              ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            fi
            echo "patched $f"
          done
          # غیرفعال‌سازی تسک lintVital در همه ساب‌پروژه‌ها
          for root in android/build.gradle.kts android/build.gradle; do
            [ -f "$root" ] || continue
            if grep -q 'lintVital' "$root"; then
              echo "root already has lintVital rule: $root"
              continue
            fi
            echo 'subprojects { tasks.configureEach { if (name.contains("lintVital")) { enabled = false } } }' >> "$root"
            echo "appended lintVital disable to $root"
          done
          grep -n "checkReleaseBuilds\|lintVital" android/app/build.gradle* android/build.gradle* android/gradle.properties 2>/dev/null || true


      - name: Build APK
        run: |
          # یک بار تلاش مجدد در صورت خطای موقتی Gradle/NDK
          flutter build apk --release

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Collect release files
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/hesabgar-man-${{ steps.ver.outputs.name }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/hesabgar-man-${{ steps.ver.outputs.name }}.aab"
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabgar-apk
          path: dist/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabgar-aab
          path: dist/*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-b${{ github.run_number }}
          name: "حسابگر من ${{ steps.ver.outputs.name }} (build ${{ github.run_number }})"
          body: |
            ## حسابگر من ${{ steps.ver.outputs.name }}
            - Build: `${{ github.run_number }}`
            - Commit: `${{ github.sha }}`
            - نسخه pubspec: `${{ steps.ver.outputs.version }}`

            ### فایل‌ها
            - **APK** — نصب مستقیم روی گوشی / بازار / مایکت
            - **AAB** — انتشار در Google Play
          files: |
            dist/*.apk
            dist/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
