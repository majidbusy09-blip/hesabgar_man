name: حسابگر من — Flutter Pull Request Validation

on:
  push:
    branches: [main, jet-ai/onboarding-memory-and-ci, 'jet-ai/**']
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "assets/**"
      - "AGENTS.md"
      - "docs/**/*.md"
      - ".github/workflows/project-validation.yml"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "assets/**"
      - "AGENTS.md"
      - "docs/**/*.md"
      - ".github/workflows/project-validation.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hesabgar-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Validate release workflow YAML syntax
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/build.yml")'

      - name: Report toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Checkout pinned JET AI semantic tooling
        uses: actions/checkout@v4
        with:
          repository: majidbusy09-blip/jetconfig-vpn
          ref: a9a5f7a719f2011227fa5b3ff520056b4466d6a7
          path: .jet-ai/central

      - name: Run project-bound resolved source-index smoke test
        working-directory: .jet-ai/central/tools/project_memory/semantic
        env:
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          manifest="$GITHUB_WORKSPACE/.jet-ai/central/docs/projects/hesabgar-man/manifest.json"
          manifest_repository_id="$(jq -r '.repository.repository_id' "$manifest")"
          test "$EXPECTED_REPOSITORY_ID" = "$manifest_repository_id"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          dart pub get --enforce-lockfile
          dart run bin/resolve.dart --write \
            --repository-root="$GITHUB_WORKSPACE" \
            --project-manifest="$manifest" \
            --source-revision="$GITHUB_SHA"
          dart run bin/resolve.dart --check \
            --repository-root="$GITHUB_WORKSPACE" \
            --project-manifest="$manifest" \
            --source-revision="$GITHUB_SHA"
          test -n "$(find "$GITHUB_WORKSPACE/docs/generated/projects/hesabgar-man/$EXPECTED_REPOSITORY_ID" -type f -path '*/indexes/resolved_index.json' -print -quit)"

      - name: Generate project-bound critical-path report
        working-directory: .jet-ai/central/tools/project_memory/semantic
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/hesabgar-critical-paths.json" <<'JSON'
          {
            "paths": [
              {
                "id": "app-startup",
                "title": "Application startup",
                "description": "Flutter application startup and root widget initialization",
                "entrypoints": [
                  {
                    "source_path": "lib/main.dart",
                    "kind": "function",
                    "owner": null,
                    "name": "main"
                  }
                ]
              }
            ]
          }
          JSON
          manifest="$GITHUB_WORKSPACE/.jet-ai/central/docs/projects/hesabgar-man/manifest.json"
          dart run bin/critical_paths.dart --write \
            --repository-root="$GITHUB_WORKSPACE" \
            --project-manifest="$manifest" \
            --source-revision="$GITHUB_SHA" \
            --critical-paths-manifest="$RUNNER_TEMP/hesabgar-critical-paths.json"
          dart run bin/critical_paths.dart --check \
            --repository-root="$GITHUB_WORKSPACE" \
            --project-manifest="$manifest" \
            --source-revision="$GITHUB_SHA" \
            --critical-paths-manifest="$RUNNER_TEMP/hesabgar-critical-paths.json"

      - name: Smoke-test task intelligence against real Hesabgar artifacts
        working-directory: .jet-ai/central
        env:
          TARGET_ROOT: ${{ github.workspace }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from tools.task_orchestrator.context_selector import select_context
          from tools.task_orchestrator.impact_analyzer import analyze_impact

          root = Path(os.environ["TARGET_ROOT"])
          revision = os.environ["GITHUB_SHA"]
          repository_id = os.environ["EXPECTED_REPOSITORY_ID"]
          manifest = root / ".jet-ai/central/docs/projects/hesabgar-man/manifest.json"
          assert str(json.loads(manifest.read_text(encoding="utf-8"))["repository"]["repository_id"]) == repository_id

          generated = root / "docs/generated/projects/hesabgar-man" / repository_id
          matches = list(generated.glob(f"*/{revision}/indexes/resolved_index.json"))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one project-bound resolved index, found {len(matches)}.")
          resolved = matches[0]
          critical = resolved.parent / "critical_paths.json"
          index = json.loads(resolved.read_text(encoding="utf-8"))
          critical_report = json.loads(critical.read_text(encoding="utf-8"))
          index_binding = index.get("project_binding")
          if not isinstance(index_binding, dict):
              raise SystemExit("Resolved index has no project binding.")
          if index.get("source_revision") != revision or index_binding.get("base_sha") != revision:
              raise SystemExit("Resolved index is not pinned to the exact checked-out source revision.")
          if index_binding.get("repository_id") != repository_id:
              raise SystemExit("Resolved index repository ID does not match the live GitHub repository.")
          source = index.get("source", {})
          files = source.get("files", []) if isinstance(source, dict) else []
          if not files or any(not item.get("git_blob_sha") for item in files):
              raise SystemExit("Resolved index is missing tracked source Git blob fingerprints.")
          analyzer = index.get("analyzer", {})
          if analyzer.get("error_count") != 0:
              raise SystemExit("Resolved index reports analyzer errors.")
          if critical_report.get("project_binding") != index_binding:
              raise SystemExit("Critical-path report project binding differs from the resolved index.")
          if critical_report.get("source_revision") != revision:
              raise SystemExit("Critical-path report is not pinned to the exact source revision.")
          binding = dict(index_binding)
          binding.pop("base_sha", None)
          task = {
              "task_id": "ci-hesabgar-task-intelligence-smoke",
              "goal": "Trace Flutter application startup and root widget initialization.",
              "capability_improved": "Select relevant application source and verify change impact.",
              "repository": {"base_sha": revision},
              "github_project_binding": binding,
              "scope": {"allowed": ["lib/**"], "excluded": []},
          }
          selection = select_context(
              root=root,
              task_record=task,
              query="main application startup initialization",
              resolved_index_path=resolved,
              critical_paths_path=critical,
              limit=5,
          )
          impact = analyze_impact(
              root=root,
              task_record=task,
              changed_paths=["lib/main.dart"],
              resolved_index_path=resolved,
              critical_paths_path=critical,
          )
          if not selection.get("suggestions"):
              raise SystemExit("Task intelligence returned no context suggestions for the startup query.")
          if impact.get("indexed_changed_paths") != ["lib/main.dart"]:
              raise SystemExit("Impact analyzer did not verify lib/main.dart at the pinned revision.")
          print(f"Task-intelligence smoke passed for {repository_id} at {revision}.")
          print(f"Context suggestions: {len(selection['suggestions'])}; indexed changed paths: {impact['indexed_changed_paths']}.")
          PY

      - name: Preserve project-bound source and critical-path indexes
        uses: actions/upload-artifact@v4
        with:
          name: hesabgar-man-resolved-index
          path: docs/generated/projects/hesabgar-man/${{ github.repository_id }}/**/indexes/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Preserve resolved dependency lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: hesabgar-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 7

      - name: Static analysis
        run: flutter analyze lib test --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Download pinned Vazirmatn font assets
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/vazirmatn-v33.003.zip" \
            https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip
          unzip -j "$RUNNER_TEMP/vazirmatn-v33.003.zip" "fonts/ttf/Vazirmatn-Regular.ttf" -d assets/fonts/
          unzip -j "$RUNNER_TEMP/vazirmatn-v33.003.zip" "fonts/ttf/Vazirmatn-Medium.ttf" -d assets/fonts/
          unzip -j "$RUNNER_TEMP/vazirmatn-v33.003.zip" "fonts/ttf/Vazirmatn-Bold.ttf" -d assets/fonts/
          rm -f "$RUNNER_TEMP/vazirmatn-v33.003.zip"

      - name: Run tests
        run: flutter test --no-pub
