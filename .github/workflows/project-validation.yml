name: حسابگر من — Flutter Pull Request Validation

on:
  push:
    branches: [jet-ai/onboarding-memory-and-ci]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "assets/**"
      - ".github/workflows/project-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "assets/**"
      - ".github/workflows/project-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hesabgar-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze lib test --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --no-pub
